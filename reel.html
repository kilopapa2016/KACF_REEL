<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>15초 브랜드 쇼릴 템플릿</title>
<style>
  :root{
    --navy:#224FA3; --navy-deep:color-mix(in srgb, var(--navy) 50%, #06101F); --ink:#0B1226; --teal:#49A5BF;
    --white:#FFFFFF; --accent:#FFB800;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--ink);color:var(--white);
    font-family:"Paperlogy","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}

  .stage{position:relative;width:min(100vw - 32px, 1280px);aspect-ratio:16/9;overflow:hidden;
    background:var(--navy-deep);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;transition:opacity .45s}
  .scene.on{opacity:1;visibility:visible}
  .scene.out{opacity:0}

  .photo{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.12);background-color:var(--navy-deep)}
  .on .photo{animation:kb 4s ease-out forwards}
  @keyframes kb{to{transform:scale(1.0)}}
  .shade{position:absolute;inset:0;background:linear-gradient(115deg,rgba(11,18,38,.92) 0%,rgba(19,44,92,.72) 55%,rgba(11,18,38,.6) 100%)}
  .grid{position:absolute;inset:0;background-image:
      linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:64px 64px;mask-image:radial-gradient(ellipse at center,#000 40%,transparent 80%)}

  .kicker{font-size:clamp(12px,1.4vw,20px);letter-spacing:.35em;text-transform:uppercase;color:var(--teal);font-weight:700}
  .h1{font-size:clamp(34px,7vw,104px);font-weight:900;line-height:1.05;letter-spacing:-.02em;text-shadow:0 8px 40px rgba(0,0,0,.5)}
  .h2{font-size:clamp(22px,3.6vw,52px);font-weight:800;line-height:1.2}
  .sub{font-size:clamp(14px,1.8vw,26px);color:rgba(255,255,255,.82)}
  .rise{opacity:0;transform:translateY(40px)}
  .on .rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .d1{animation-delay:.15s!important}.d2{animation-delay:.35s!important}.d3{animation-delay:.55s!important}.d4{animation-delay:.75s!important}

  .s1 .box{position:relative;text-align:center;z-index:2}
  .plate{display:inline-block;background:var(--white);border-radius:16px;padding:3% 5%;
    box-shadow:0 30px 80px rgba(0,0,0,.45);clip-path:inset(0 100% 0 0)}
  .on .plate{animation:reveal .9s .3s cubic-bezier(.7,0,.2,1) forwards}
  @keyframes reveal{to{clip-path:inset(0 0 0 0)}}
  .plate img{display:block;max-width:min(56vw,640px);max-height:min(22vw,200px);height:auto}
  .plate.noimg{display:none}
  .plate.dark{background:var(--navy-deep);border:1px solid rgba(255,255,255,.25)}   /* 흰색 로고용 (SPEC.logoOnDark) */
  .s1 .bar{width:0;height:6px;background:var(--accent);margin:22px auto 0;border-radius:3px}
  .s1.on .bar{animation:grow .8s 1.1s cubic-bezier(.7,0,.2,1) forwards}
  @keyframes grow{to{width:min(40%,320px)}}

  .strips{position:absolute;inset:-10% 0;display:grid;grid-template-columns:repeat(3,1fr);gap:1.2%;padding:0 3%}
  .col{display:flex;flex-direction:column;gap:2.4%}
  .col img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;opacity:.55;filter:saturate(.9);background:rgba(255,255,255,.06)}
  .on .col.up{animation:slideUp 7s linear forwards}
  .on .col.down{animation:slideDown 7s linear forwards}
  @keyframes slideUp{from{transform:translateY(6%)}to{transform:translateY(-14%)}}
  @keyframes slideDown{from{transform:translateY(-16%)}to{transform:translateY(4%)}}
  .s2 .shade{background:linear-gradient(180deg,rgba(11,18,38,.55),rgba(11,18,38,.85))}
  .s2 .words{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:.25em .4em;justify-content:center;max-width:82%;text-align:center;
    text-shadow:0 6px 30px rgba(0,0,0,.6)}
  .s2 .w{display:inline-block;opacity:0;transform:translateY(30px) rotate(-2deg)}
  .s2.on .w{animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards}
  .s2 .w.hl{color:var(--accent)}

  .s3 .wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:22px;width:92%}
  .cards{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:1.4%;width:100%}
  .dcard{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;opacity:0;transform:translateY(60px) scale(.9);
    box-shadow:0 18px 50px rgba(0,0,0,.45);background:linear-gradient(160deg,var(--navy),var(--navy-deep))}
  .s3.on .dcard{animation:cardin .6s cubic-bezier(.2,1.2,.3,1) forwards}
  .dcard:nth-child(1){animation-delay:.15s}.dcard:nth-child(2){animation-delay:.35s}.dcard:nth-child(3){animation-delay:.55s}
  .dcard:nth-child(4){animation-delay:.75s}.dcard:nth-child(5){animation-delay:.95s}.dcard:nth-child(6){animation-delay:1.15s}
  @keyframes cardin{to{opacity:1;transform:none}}
  .dcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.15)}
  .s3.on .dcard img{animation:kb 4s ease-out forwards}
  .dcard .lab{position:absolute;left:0;right:0;bottom:0;padding:14% 7% 8%;font-weight:800;font-size:clamp(11px,1.5vw,22px);line-height:1.2;
    word-break:keep-all;overflow-wrap:anywhere;background:linear-gradient(180deg,transparent,rgba(11,18,38,.95))}

  .s4 .cols{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:6%;width:84%;align-items:center}
  .num{font-size:clamp(56px,12vw,180px);font-weight:900;line-height:.95;color:var(--accent);letter-spacing:-.04em;text-shadow:0 10px 40px rgba(0,0,0,.5)}
  .num small{font-size:.35em;color:var(--white);margin-left:.15em;letter-spacing:0}
  .card{border-left:6px solid var(--teal);padding-left:5%}
  .card .h2{margin-bottom:.3em}

  .s5 .box{position:relative;z-index:2;text-align:center}
  .s5 .mark{width:clamp(56px,7vw,96px);height:auto;border-radius:14px;background:#fff;padding:8px;display:block;margin:0 auto 14px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
  .s5 .mark.noimg{display:none}
  .s5 .url{font-size:clamp(28px,5.5vw,84px);font-weight:900;letter-spacing:.02em}
  .s5 .url span{color:var(--teal)}
  .s5 .ring{position:absolute;left:50%;top:50%;width:20px;height:20px;border:3px solid var(--teal);border-radius:50%;
    transform:translate(-50%,-50%);opacity:0;z-index:1}
  .s5.on .ring{animation:ring 1.6s ease-out .2s 2}
  @keyframes ring{0%{opacity:.9;width:20px;height:20px}100%{opacity:0;width:140vmin;height:140vmin}}
  .s5 .photo{filter:blur(3px)}

  .progress{position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--accent);z-index:5}
  .stamp{position:absolute;right:18px;top:14px;font-size:12px;letter-spacing:.2em;color:rgba(255,255,255,.6);z-index:5}
  .ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;color:#B9C4DA;font-size:14px}
  button{font:inherit;font-weight:700;padding:.55em 1.2em;border-radius:8px;border:1px solid #33518F;background:#16264B;color:#fff;cursor:pointer}
  button:hover{background:#1E3466}
  input[type=range]{width:min(50vw,480px);accent-color:var(--accent)}
  .tc{font-variant-numeric:tabular-nums;min-width:5.5em;text-align:center}
  .note{max-width:1280px;color:#8FA0C4;font-size:13px;line-height:1.6;text-align:center}

  /* 세로(9:16) 모드: 무대 크기 기준 단위(cqw)로 글자·배치를 다시 잡는다 */
  .stage{container-type:inline-size;flex:none}
  .stage.portrait{width:min(100vw - 32px, (100vh - 230px) * 9 / 16);min-width:270px;aspect-ratio:9/16}
  .portrait .kicker{font-size:3.4cqw}
  .portrait .h1{font-size:12cqw}
  .portrait .h2{font-size:8cqw}
  .portrait .sub{font-size:4.4cqw}
  .portrait .plate img{max-width:68cqw;max-height:30cqw}
  .portrait .col img{aspect-ratio:3/4}
  .portrait .s2 .words{max-width:86%}
  .portrait .s3 .wrap{width:84%;gap:5cqw}
  .portrait .cards{grid-template-columns:1fr !important;gap:2.4cqw}
  .portrait .dcard{aspect-ratio:16/5}
  .portrait .dcard .lab{font-size:5.2cqw;padding:0 6% 5%;display:flex;align-items:flex-end;top:0;background:linear-gradient(90deg,rgba(11,18,38,.92),rgba(11,18,38,.35))}
  .portrait .s4 .cols{grid-template-columns:1fr;gap:9cqw;width:82%}
  .portrait .num{font-size:30cqw}
  .portrait .s5 .url{font-size:11cqw}
  .portrait .s5 .mark{width:18cqw}
  .portrait .stamp{font-size:2.4cqw;right:4cqw;top:3cqw}

  /* 녹화 중: 무대만 화면 가운데 크게, 나머지는 가린다 */
  body.rec{overflow:hidden}
  body.rec::before{content:"";position:fixed;inset:0;background:#000;z-index:90}
  body.rec .stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:91;border-radius:0;box-shadow:none;
    width:min(100vw, 100vh * 16 / 9)}
  body.rec .stage.portrait{width:min(100vw, 100vh * 9 / 16);min-width:0}
  button.on{background:#2B4A8C;border-color:var(--teal)}
  .rec-btn{background:#7A1E2B;border-color:#B8384A}
  .rec-btn:hover{background:#962638}
  .ctl label.btnlike{font-weight:700;padding:.55em 1.2em;border-radius:8px;border:1px solid #33518F;background:#16264B;color:#fff;cursor:pointer}
  .ctl label.btnlike:hover{background:#1E3466}
  .musicname{font-size:12px;color:#9FB0D6;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 주소 입력줄: URL → SPEC */
  .urlbar{display:flex;gap:8px;width:min(100vw - 32px,1280px)}
  .urlbar input{flex:1;min-width:0;font:inherit;font-size:15px;padding:.7em 1em;border-radius:10px;border:1px solid #33518F;background:#0F1A33;color:#fff;outline:none}
  .urlbar input:focus{border-color:var(--teal)}
  .urlbar button{flex:none;background:var(--accent);border-color:var(--accent);color:#1A1300}
  .urlbar button:hover{background:#FFC93A}
  .urlbar button:disabled{opacity:.6;cursor:wait}
  .urlmsg{width:min(100vw - 32px,1280px);min-height:1.4em;font-size:13px;line-height:1.5;color:#8FA0C4;margin-top:-6px}
  .urlmsg.err{color:#FF8A80}
  .urlmsg.ok{color:#9FE0C0}

  /* SPEC 편집 서랍 */
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100vw);background:#0F1A33;border-left:1px solid #26407A;
    transform:translateX(100%);transition:transform .3s;z-index:50;display:flex;flex-direction:column;padding:16px;gap:10px}
  .drawer.open{transform:none}
  .drawer h3{font-size:15px;color:#CFE0FF;display:flex;justify-content:space-between;align-items:center}
  .drawer textarea{flex:1;width:100%;font:13px/1.45 Consolas,"D2Coding",monospace;background:#0A1226;color:#DDE7FF;border:1px solid #26407A;border-radius:8px;padding:10px;resize:none}
  .drawer .row{display:flex;gap:8px;flex-wrap:wrap}
  .drawer .msg{font-size:12px;color:#8FA0C4;min-height:1.2em}
  .drawer .msg.err{color:#FF8A80}
</style>
</head>
<body>

<form class="urlbar" id="urlbar" autocomplete="off">
  <input id="siteUrl" type="text" inputmode="url" placeholder="홍보할 사이트 주소를 넣으세요 (예: https://www.kacf.co.kr)" aria-label="사이트 주소">
  <button type="submit" id="make">쇼릴 만들기</button>
</form>
<div class="urlmsg" id="urlmsg" role="status"></div>

<div class="stage" id="stage" aria-label="15초 브랜드 쇼릴">
  <div class="stamp" id="stamp">15s SHOWREEL</div>

  <section class="scene s1" data-in="0" data-out="2.8">
    <div class="photo" id="bg-s1"></div><div class="shade"></div><div class="grid"></div>
    <div class="box">
      <div class="kicker rise" id="t-kicker1"></div>
      <div class="plate" id="plate" style="margin-top:18px"><img id="img-logo" alt="로고"></div>
      <div class="h1 rise d2" id="t-name" hidden></div>
      <div class="bar"></div>
    </div>
  </section>

  <section class="scene s2" data-in="2.8" data-out="6">
    <div class="strips" id="strips"></div><div class="shade"></div>
    <div class="words h2" id="t-slogan"></div>
  </section>

  <section class="scene s3" data-in="6" data-out="9.8">
    <div class="grid"></div>
    <div class="wrap">
      <div class="kicker rise" id="t-deptkicker"></div>
      <div class="cards" id="t-depts"></div>
    </div>
  </section>

  <section class="scene s4" data-in="9.8" data-out="12.6">
    <div class="photo" id="bg-s4"></div><div class="shade"></div>
    <div class="cols">
      <div class="rise"><div class="num" id="t-num"></div><div class="sub" id="t-numsub"></div></div>
      <div class="card rise d3"><div class="h2" id="t-fact1"></div><div class="sub" id="t-fact2"></div></div>
    </div>
  </section>

  <section class="scene s5" data-in="12.6" data-out="15">
    <div class="photo" id="bg-s5"></div><div class="shade"></div><div class="ring"></div>
    <div class="box">
      <img class="mark rise" id="img-mark" alt="심볼">
      <div class="kicker rise d1" id="t-ctakicker"></div>
      <div class="url rise d2" id="t-url"></div>
      <div class="sub rise d4" id="t-contact"></div>
    </div>
  </section>

  <div class="progress" id="bar"></div>
</div>

<div class="ctl">
  <button id="play">처음부터 재생</button>
  <button id="pause">일시정지</button>
  <input type="range" id="seek" min="0" max="15" step="0.05" value="0">
  <span class="tc" id="tc">0.00 / 15.00</span>
  <button id="edit">SPEC 편집</button>
</div>
<div class="ctl">
  <button id="ratio" title="가로 16:9 ↔ 세로 9:16">세로 9:16으로</button>
  <label class="btnlike" for="musicFile" title="mp3·m4a·wav 등 음악 파일 선택">♪ 음악 선택</label>
  <input type="file" id="musicFile" accept="audio/*" hidden>
  <span class="musicname" id="musicName">음악 없음</span>
  <button id="mute" title="소리 켜기/끄기" hidden>🔊</button>
  <button id="musicOff" title="음악 빼기" hidden>✕</button>
  <button id="record" class="rec-btn">● 영상 저장</button>
</div>
<audio id="bgm" preload="auto"></audio>
<p class="note" id="note">위 칸에 사이트 주소를 넣으면 그 메인 페이지의 원문·사진으로 SPEC을 만들어 재생한다. 주소 뒤 #spec= 에 실린 분석 결과(SPEC)도 읽어 재생한다. SPEC이 없으면 견본(대한민국 인공지능 영화제)을 보여 준다.<br>
로고·사진은 원본 사이트 자산이다. 시안은 내부 확인용이며 외부 게시 전 해당 기관의 허가가 필요하다.</p>

<aside class="drawer" id="drawer">
  <h3>SPEC 편집 <button id="close">닫기</button></h3>
  <textarea id="ta" spellcheck="false"></textarea>
  <div class="row">
    <button id="apply">적용</button>
    <button id="copyUrl">공유 주소 복사</button>
    <button id="copyJson">JSON 복사</button>
    <button id="reset">견본으로</button>
  </div>
  <div class="msg" id="msg">문구·사진 주소를 고친 뒤 적용. 적용하면 주소창의 #spec도 갱신된다.</div>
</aside>

<script>
/* ───────── 0. 견본 SPEC (대한민국 인공지능 영화제 KACF, 2026-10-01 수집) ───────── */
const DEMO = {
  source:{url:"https://www.kacf.co.kr/", collectedAt:"2026-10-01"},
  name:"대한민국 인공지능 영화제", logo:"assets/logo_white.png", logoOnDark:true,
  photos:{hero:"assets/hero_stage.png", people:"assets/kacf2_group.jpg",
    strip:["assets/kacf1_group.png","assets/kacf1_screening.png","assets/kacf1_speaker.png",
           "assets/kacf1_jury_intro.png","assets/kacf1_sponsor_prize.png","assets/kacf1_posters.png",
           "assets/kacf2_group.jpg","assets/kacf2_gv.jpg","assets/kacf2_audience.jpg","assets/kacf2_awards_aifilm.png"]},
  kicker:"KOREA AI CINEMA FESTIVAL",
  sloganWords:["AI로","만든","영화의","향연"], sloganHighlight:[],
  deptKicker:"8개 공식 경쟁 부문",
  depts:[{name:"AI Film",img:"assets/kacf1_screening.png"},{name:"AI Music Video",img:"assets/kacf1_sponsor_prize.png"},
         {name:"AI Movie Director",img:"assets/kacf1_speaker.png"},{name:"Best Animation Short",img:"assets/kacf1_posters.png"},
         {name:"Best AI Commercial Film",img:"assets/kacf2_awards_grid.png"}],
  bigNumber:"8", bigUnit:"", bigSub:"공식 경쟁 부문으로 진행됩니다.",
  fact1:"2026년 12월 17일 대한민국인공지능영화제 개최", fact2:"October 31 - Regular Deadline",
  ctaKicker:"SUBMIT", url:["kacf",".co.kr"], contact:"kilopapa@naver.com",
  theme:{navy:"#224FA3", teal:"#49A5BF", accent:"#FFB800"}
};

/* ───────── 1. SPEC 읽기: #spec=base64url(JSON) → localStorage → 견본 ───────── */
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/") + "=".repeat((4 - s.length % 4) % 4))));
const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function loadSpec(){
  const m = location.hash.match(/spec=([^&]+)/);
  if (m){ try { return JSON.parse(b64d(m[1])); } catch(e){ console.warn("spec 해석 실패", e); } }
  try { const s = localStorage.getItem("reelSpec"); if (s) return JSON.parse(s); } catch(e){}
  return DEMO;
}
function normalize(s){
  const d = JSON.parse(JSON.stringify(DEMO));
  const o = Object.assign({}, s);
  o.name = o.name || "기관명";
  o.photos = Object.assign({hero:"",people:"",strip:[]}, o.photos||{});
  o.sloganWords = (o.sloganWords && o.sloganWords.length) ? o.sloganWords : [o.name];
  o.sloganHighlight = o.sloganHighlight || [];
  o.depts = (o.depts||[]).filter(x=>x && x.name).slice(0,6);
  o.url = o.url || [location.hostname, ""];
  o.theme = Object.assign({}, d.theme, o.theme||{});
  o.kicker = o.kicker || (o.source && o.source.url ? new URL(o.source.url).hostname.replace(/^www\./,"").toUpperCase() : "SHOWREEL");
  return o;
}

/* ───────── 2. SPEC → 화면 ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(spec){
  const S = normalize(spec);
  const r = document.documentElement.style;
  if (S.theme.navy) r.setProperty("--navy", S.theme.navy);
  if (S.theme.teal) r.setProperty("--teal", S.theme.teal);
  if (S.theme.accent) r.setProperty("--accent", S.theme.accent);
  document.title = `${S.name} 15초 브랜드 쇼릴`;
  $("#stamp").textContent = `${S.kicker} · 15s SHOWREEL`;
  $("#t-kicker1").textContent = S.kicker;
  // 로고가 없으면 기관명을 큰 글자로
  const logo = $("#img-logo"); logo.onerror = () => { $("#plate").classList.add("noimg"); $("#t-name").hidden = false; };
  $("#plate").classList.toggle("noimg", !S.logo); $("#plate").classList.toggle("dark", !!S.logoOnDark);
  $("#t-name").hidden = !!S.logo; $("#t-name").textContent = S.name;

/* ───────── 6. 주소 → SPEC: 중계 Worker로 페이지를 받아 원문·사진을 뽑는다 ───────── */
// 브라우저는 다른 사이트의 HTML을 직접 못 읽으므로(CORS) Cloudflare Worker가 대신 받아 준다 (worker/worker.js)
// 시험용으로 다른 중계소를 쓰려면 reel.html?proxy=주소 로 연다
const PROXY = new URLSearchParams(location.search).get("proxy") || "https://site-reel.kilopapa.workers.dev/";
const viaProxy = u => PROXY + (PROXY.includes("?") ? "&" : "?") + "url=" + encodeURIComponent(u);
const clean = s => String(s || "").replace(/\s+/g, " ").trim();
const koRatio = s => (s.match(/[가-힣]/g) || []).length / Math.max(s.length, 1);
const noSpace = s => String(s || "").replace(/\s+/g, "");

async function fetchDoc(url){
  let res;
  try { res = await fetch(viaProxy(url)); } catch(e){ throw new Error("중계 Worker에 연결하지 못했다. 인터넷 연결과 Worker 주소를 확인한다."); }
  const type = res.headers.get("content-type") || "";
  if (!res.ok) throw new Error((await res.text()).slice(0, 200) || ("HTTP " + res.status));
  if (!/html/i.test(type)) throw new Error("중계 Worker가 HTML을 돌려주지 않았다. Worker에 worker.js 코드가 배포됐는지 확인한다.");
  const buf = await res.arrayBuffer();
  // 글자 인코딩: 응답 헤더 → <meta charset> 순으로 찾고, 없으면 UTF-8 (EUC-KR 사이트 대비)
  let cs = (type.match(/charset=["']?([\w-]+)/i) || [])[1];
  if (!cs) cs = (new TextDecoder("latin1").decode(buf.slice(0, 4096)).match(/<meta[^>]+charset=["']?([\w-]+)/i) || [])[1];
  let html; try { html = new TextDecoder(cs || "utf-8").decode(buf); } catch(e){ html = new TextDecoder("utf-8").decode(buf); }
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.querySelectorAll("script,style,noscript,template").forEach(e => e.remove());
  doc.querySelectorAll("br").forEach(b => b.replaceWith("\n"));
  return { doc, url: res.headers.get("X-Final-URL") || url };
}

// 틀(frame)로 감싼 사이트는 본문 틀을 따라 들어간다 (최대 3단계)
async function loadPage(url, depth = 0){
  const p = await fetchDoc(url);
  const frames = [...p.doc.querySelectorAll("iframe[src],frame[src]")].filter(f => {
    const st = f.getAttribute("style") || "", src = f.getAttribute("src") || "";
    return !/display\s*:\s*none|(^|;)\s*(width|height)\s*:\s*0/i.test(st) && f.getAttribute("width") !== "0" && f.getAttribute("height") !== "0"
      && !/^(about:|javascript:)|youtube|vimeo|google|facebook|kakao|map/i.test(src);
  });
  if (depth < 3 && clean(p.doc.body && p.doc.body.textContent).length < 300 && frames.length){
    const f = frames.find(f => /content|main|body/i.test((f.getAttribute("name") || "") + (f.id || ""))) || frames[0];
    return loadPage(new URL(f.getAttribute("src"), p.url).href, depth + 1);
  }
  return p;
}

function imgSize(src){
  return new Promise(r => { const im = new Image(), t = setTimeout(() => r({ w: 0, h: 0 }), 5000);
    im.onload = () => { clearTimeout(t); r({ w: im.naturalWidth, h: im.naturalHeight }); };
    im.onerror = () => { clearTimeout(t); r({ w: 0, h: 0 }); }; im.src = src; });
}

// 흰색 로고 판정: 로고를 중계로 받아 불투명 픽셀 평균 밝기가 200을 넘으면 어두운 판에 올린다
async function isWhiteLogo(src){
  try {
    const blob = await (await fetch(viaProxy(src))).blob(); if (!/^image\//.test(blob.type)) return false;
    const im = new Image(), u = URL.createObjectURL(blob);
    await new Promise((ok, no) => { im.onload = ok; im.onerror = no; im.src = u; });
    const c = document.createElement("canvas"); c.width = Math.min(200, im.naturalWidth || 200); c.height = Math.max(1, Math.round(c.width * (im.naturalHeight || 1) / (im.naturalWidth || 1)));
    const g = c.getContext("2d"); g.drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
    const d = g.getImageData(0, 0, c.width, c.height).data; let s = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 100){ s += (d[i] + d[i + 1] + d[i + 2]) / 3; n++; }
    return n > 0 && s / n > 200;
  } catch(e){ return false; }
}

async function specFromUrl(input){
  const { doc, url } = await loadPage(input);
  const abs = u => { try { return new URL(u, url).href; } catch(e){ return ""; } };
  const meta = n => { const m = doc.querySelector(`meta[property="${n}"],meta[name="${n}"]`); return m && m.content ? m.content.trim() : ""; };
  const host = new URL(url).hostname.replace(/^www\./, "");
  const navSel = "nav,header,[role=navigation],.gnb,#gnb,.lnb,.menu,.nav,[class*=menu],[class*=Menu]";
  const footSel = "footer,.footer,#footer,[class*=footer],[class*=Footer]";

  // 이름
  let name = "";
  for (const c of [meta("og:site_name"), meta("application-name"), meta("og:title").split(/[|:\-–—]/)[0], doc.title.split(/[|:\-–—]/)[0]]){
    const v = clean(c.replace(/메인|홈페이지|공식|로고/g, " "));
    if (v.length >= 2 && v.length <= 20 && !/\d{4}/.test(v)){ name = v; break; }
  }
  name = name || host;

  // 원문 줄: 블록 요소를 품지 않은 요소의 글을 줄바꿈 단위로 (중복·메뉴·바닥글 표시)
  const block = "div,p,ul,ol,li,table,section,article,h1,h2,h3,h4,h5,header,footer,nav,form,dl";
  const lines = []; const seenLine = new Set();
  doc.body && doc.body.querySelectorAll("*").forEach(el => {
    if (el.querySelector(block)) return;
    const inNav = !!el.closest(navSel), inFoot = !!el.closest(footSel);
    const parts = (el.textContent || "").split("\n").map(clean).filter(Boolean);
    for (let i = 0; i < parts.length; i++){
      let t = parts[i];
      while (/\/$/.test(t) && i + 1 < parts.length) t += " " + parts[++i];   // "A / B /" 다음 줄과 이어진 목록
      if (!seenLine.has(t)){ seenLine.add(t); lines.push({ t, inNav, inFoot }); }
    }
  });
  const body = lines.filter(l => !l.inNav).map(l => l.t);

  // 슬로건: 짧은 명사형 문구 (문장형 "~다." 와 꾸밈말로 끝나는 미완성 줄은 제외), 기관명이 붙어 있으면 떼어 낸다
  const ui = /바로가기|공지사항|안내|신청|로그인|다운로드|더보기|로고|아이콘|창을|하루|닫기|열지|출력|조회|고지서|신고|센터|시스템|포털|메뉴|클릭|Copyright|개인정보|사업자/;   // 사이트 기능 문구
  const bad = new RegExp("\\d{4}|" + ui.source);
  const dangling = /[는은의와과를을에]$/;
  const sentence = /(다|요)[.!]*$/;
  let slogan = "";
  const desc = clean(meta("og:description") || meta("description"));
  for (let t of [desc.split(/[.!?。]|\s-\s/)[0] || "", ...body]){
    if (noSpace(t).includes(noSpace(name)) && /,|\s-\s|·/.test(t)) t = clean(t.split(/,|\s-\s|·/).find(s => !noSpace(s).includes(noSpace(name))) || "");
    if (t.length >= 8 && t.length <= 40 && t.includes(" ") && koRatio(t) >= .45 && !noSpace(t).includes(noSpace(name))
        && !bad.test(t) && !dangling.test(t) && !sentence.test(t)){ slogan = t; break; }
  }

  // 사진: 실제 크기를 재서 가로 사진·큰 순으로, 로고·아이콘·버튼 제외
  const imgEls = [...doc.querySelectorAll("img")];
  const keyOf = el => { let k = "", p = el; for (let i = 0; i < 4 && p && p.getAttribute; i++, p = p.parentElement) k += " " + (p.getAttribute("class") || "") + " " + (p.id || ""); return (k + " " + (el.getAttribute("alt") || "")).toLowerCase(); };
  const srcOf = el => el.getAttribute("data-src") || el.getAttribute("data-original") || el.getAttribute("data-lazy") || el.getAttribute("src") || "";
  const logoEl = imgEls.find(el => /logo|로고/.test(keyOf(el) + " " + srcOf(el).toLowerCase()));
  const logo = logoEl ? abs(srcOf(logoEl)) : "";
  const cand = [...new Set(imgEls.filter(el => el !== logoEl && !/logo|icon|btn|button|close|popup|pop_|qr|arrow|sns|banner_/.test(keyOf(el) + " " + srcOf(el).toLowerCase()))
    .map(el => abs(srcOf(el))).filter(u => u && !u.startsWith("data:") && !/\.gif(\?|$)/i.test(u)))].slice(0, 40);
  doc.querySelectorAll("[style*=background]").forEach(el => { const m = (el.getAttribute("style") || "").match(/url\(["']?([^"')]+)/); if (m && cand.length < 50) cand.push(abs(m[1])); });
  const sized = await Promise.all([...new Set(cand)].map(async src => ({ src, ...(await imgSize(src)) })));
  const photos = sized.filter(i => i.w >= 260 && i.h >= 160 && i.w / i.h < 3.2 && i.h / i.w < 2.2)
    .sort((a, b) => ((b.w > b.h) - (a.w > a.h)) || (b.w * b.h - a.w * a.h)).map(i => i.src);
  const logoOnDark = logo ? await isWhiteLogo(logo) : false;

  // 부문: "A / B / C" 형태 원문 목록 → 학과·전공 메뉴 → 일반 메뉴 순
  let depts = [];
  for (const t of body){ if (/:\/\/|www\.|\d{4}[.\/-]\d/.test(t)) continue;   // 주소·날짜의 "/"는 목록이 아니다
    const parts = t.split(/\s+\/\s+|\s+\/$/).map(clean).filter(Boolean);
    if (parts.length >= 3 && parts.every(s => s.length >= 2 && s.length <= 30)){ depts = parts.slice(0, 5); break; } }
  const stop = /^(홈|home|로그인|login|회원가입|join|사이트맵|sitemap|검색|search|english|eng|kor|한국어|메뉴|menu|전체메뉴|바로가기|top|더보기|닫기|open|close|facebook|instagram|youtube|blog|kakao|이전|다음|prev|next)$/i;
  const items = [...new Set([...doc.querySelectorAll(navSel.split(",").map(s => s + " a").join(","))].map(a => clean(a.textContent)))]
    .filter(s => s.length >= 2 && s.length <= 14 && !stop.test(s) && !/\d{2,}|바로가기|전체보기/.test(s));
  const units = items.filter(s => /(학과|학부|전공)$/.test(s));
  if (!depts.length) depts = (units.length >= 3 ? units : items).slice(0, 5);
  const allText = body.join(" ");
  const kick = allText.match(/\d+\s*개\s*(?:의\s*)?(?:[가-힣]+\s*){0,2}(?:부문|분야|학과|과정|전공|프로그램)/);
  const deptKicker = kick ? clean(kick[0]) : (units.length >= 3 ? `${depts.length}개 학과` : `주요 항목 ${depts.length}개`);

  // 수치: 연도(2026년 등)는 빼고, % → 나머지 순서. 설명은 같은 줄에서 숫자 앞뒤 원문 중 긴 쪽 (30자, 낱말 단위)
  const nums = [];
  for (const line of body){ const re = /(\d{1,3}(?:,\d{3})+|\d+)\s*(%|명|년|억|만|개|건|위|호|시간|주|회)/g; let m;
    while ((m = re.exec(line)) && nums.length < 30){ if (m[2] === "년" && /^(19|20)\d\d$/.test(m[1])) continue;
      nums.push({ n: m[1], u: m[2], before: line.slice(0, m.index), after: line.slice(m.index + m[0].length) }); } }
  const big = nums.find(x => x.u === "%") || nums[0];
  const fitWords = (s, max, fromEnd) => { const w = s.split(" ").filter(Boolean); let out = "";
    for (const x of fromEnd ? w.reverse() : w){ const next = fromEnd ? (x + " " + out).trim() : (out + " " + x).trim(); if (next.length > max) break; out = next; } return out; };
  let bigSub = "";
  if (big){ const b = fitWords(big.before.split(/[※()\[\]!?.。]/).pop().trim(), 30, true);
    const a = fitWords(big.after.split(/[※()\[\]!?.。]/)[0].trim(), 30, false); bigSub = b.length >= a.length ? b : a; }

  // 사실 두 줄: 원문 한 줄을 자르지 않고 그대로 (fact1 28자, fact2 34자 이하)
  const factOk = t => !(slogan && t.includes(slogan)) && t.length >= 10 && koRatio(t) >= .4 && !dangling.test(t) && !(big && t.includes(big.n + big.u))
    && !ui.test(t) && !/달력|팝업|회원가입|이용약관|대표자|TEL|E-mail|입니다\.?$/i.test(t);
  const pool = lines.filter(l => !l.inNav && !l.inFoot).map(l => l.t).filter(factOk);
  const fact1 = pool.find(t => t.length <= 28) || "";
  const fact2 = pool.find(t => t !== fact1 && t.length <= 34) || "";

  // 연락처: 바닥글의 주소·전화 (없으면 이메일)
  const foot = lines.filter(l => l.inFoot).map(l => l.t).join(" ") || allText;
  const tel = (foot.match(/\b0\d{1,2}[-.\s)]\s?\d{3,4}[-.\s]\d{4}\b/) || [""])[0];
  const addr = (foot.match(/(?:[가-힣]+(?:특별시|광역시|특별자치시|특별자치도|도|시)\s?)?[가-힣]+(?:시|군|구)\s(?:[가-힣]+(?:구|군|읍|면)\s)?[가-힣0-9]+(?:로|길|동)\s?\d*(?:-\d+)?(?:\s\d+)?/) || [""])[0];
  const mail = (foot.match(/[\w.+-]+@[\w-]+\.[\w.]+/) || [""])[0];

  const dot = host.indexOf(".");
  return {
    source: { url: input, collectedAt: new Date().toISOString().slice(0, 16).replace("T", " "), tool: "reel-url" },
    name, logo, logoOnDark,
    photos: { hero: photos[0] || "", people: photos[1] || photos[0] || "", strip: photos.slice(0, 10) },
    kicker: host.toUpperCase(),
    sloganWords: slogan ? slogan.split(/\s+/) : [name], sloganHighlight: [],
    deptKicker, depts: depts.map((d, i) => ({ name: d, img: photos.length ? photos[(i + 2) % photos.length] : "" })),
    bigNumber: big ? big.n : "", bigUnit: big ? big.u : "", bigSub,
    fact1, fact2,
    ctaKicker: "VISIT · " + host.toUpperCase(), url: [dot > 0 ? host.slice(0, dot) : host, dot > 0 ? host.slice(dot) : ""],
    contact: [addr, tel].filter(Boolean).join(" · ") || mail,
    theme: { navy: meta("theme-color") }
  };
}

const urlmsg = $("#urlmsg");
function setUrlMsg(t, cls){ urlmsg.textContent = t; urlmsg.className = "urlmsg" + (cls ? " " + cls : ""); }
async function makeFromUrl(raw){

    const empty = [["로고", SPEC.logo], ["사진", SPEC.photos.hero], ["슬로건", SPEC.sloganWords[0] !== SPEC.name], ["부문", SPEC.depts.length],
                   ["큰 숫자", SPEC.bigNumber], ["사실1", SPEC.fact1], ["사실2", SPEC.fact2], ["연락처", SPEC.contact]].filter(x => !x[1]).map(x => x[0]);
    setUrlMsg(`완성: 사진 ${SPEC.photos.strip.length}장 · 부문 ${SPEC.depts.length}개` + (empty.length ? ` · 비어 있음: ${empty.join(", ")} → SPEC 편집에서 보완` : " · 모든 항목 채움"), "ok");
  } catch(e){
    const m = String(e.message || e);
    if (/redirect/i.test(m)) setUrlMsg("만들지 못했다: 이 사이트(또는 호스팅 업체)가 클라우드 서버의 접속을 막고 있다. SPEC 편집에 직접 적거나 AI 프롬프트 방식으로 SPEC을 만든다.", "err");
    else setUrlMsg("만들지 못했다: " + m.slice(0, 160), "err");
  }
  finally { $("#make").disabled = false; }
}
$("#urlbar").addEventListener("submit", e => { e.preventDefault(); makeFromUrl($("#siteUrl").value); });

/* ───────── 7. 음악: 15초 타임라인에 맞춰 재생·정지·이동, 끝 1초 페이드아웃 ───────── */
// SPEC에 "music":"assets/music.mp3"(또는 https 주소), "musicStart":30(곡의 몇 초부터) 를 넣거나 [♪ 음악 선택]으로 고른다
const bgm = $("#bgm");
let pickedMusic = null;   // [음악 선택]으로 고른 파일 {url, name}. 이 화면에서만 쓰이고 공유 주소에는 담기지 않는다
let musicStart = 0, muted = false;
function musicOn(){ return !!bgm.getAttribute("src"); }
function setMusicSource(S){
  const src = pickedMusic ? pickedMusic.url : (S.music || "");
  musicStart = Math.max(0, +(S.musicStart || 0));
  if (src){ if (bgm.getAttribute("src") !== src) bgm.src = src; } else { bgm.removeAttribute("src"); bgm.load(); }
  $("#musicName").textContent = pickedMusic ? pickedMusic.name : (S.music ? decodeURIComponent(S.music.split("/").pop()) : "음악 없음");
  $("#mute").hidden = $("#musicOff").hidden = !src;
}
function musicPlay(sec){ if (!musicOn()) return; bgm.volume = muted ? 0 : 1; try { bgm.currentTime = musicStart + sec; } catch(e){}
  const p = bgm.play(); if (p) p.catch(() => {}); }   // 자동재생이 막히면 다음 버튼 클릭 때 소리가 난다
function musicPause(){ if (musicOn()) bgm.pause(); }
function musicSeek(sec){ if (!musicOn()) return; bgm.pause(); try { bgm.currentTime = musicStart + sec; } catch(e){} }
function musicFade(t){ if (musicOn() && !muted) bgm.volume = Math.max(0, Math.min(1, DUR - t)); }
$("#musicFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  if (pickedMusic) URL.revokeObjectURL(pickedMusic.url);
  pickedMusic = { url: URL.createObjectURL(f), name: f.name }; e.target.value = "";
  setMusicSource(normalize(SPEC)); playFrom(0);
};
$("#musicOff").onclick = () => { if (pickedMusic){ URL.revokeObjectURL(pickedMusic.url); pickedMusic = null; }
  if (SPEC.music){ delete SPEC.music; delete SPEC.musicStart; }
  bgm.pause(); setMusicSource(normalize(SPEC)); };
$("#mute").onclick = () => { muted = !muted; bgm.volume = muted ? 0 : 1; $("#mute").textContent = muted ? "🔇" : "🔊"; };

/* ───────── 8. 세로 9:16 ↔ 가로 16:9 ───────── */
function setRatio(portrait){
  $("#stage").classList.toggle("portrait", portrait);
  $("#ratio").textContent = portrait ? "가로 16:9로" : "세로 9:16으로";
  try { localStorage.setItem("reelRatio", portrait ? "9:16" : "16:9"); } catch(e){}
}
$("#ratio").onclick = () => { setRatio(!$("#stage").classList.contains("portrait")); playFrom(+$("#seek").value); };
try { setRatio(localStorage.getItem("reelRatio") === "9:16"); } catch(e){}

/* ───────── 9. 영상 저장: 이 탭을 녹화해 무대만 잘라 MP4(안 되면 WebM)로 저장 ───────── */
// 흐름: 탭 공유 허락 → 무대를 화면 가운데 크게 → 0초부터 15초 재생하며 녹화 → 파일 내려받기
// 소리: 탭 오디오를 함께 녹음한다(공유 창의 "탭 오디오도 공유"가 켜져 있어야 한다)
const REC_TYPES = ["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4;codecs=avc1,mp4a.40.2", "video/mp4",
                   "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
let recording = false, audioCtx = null, bgmNode = null;
function lockUI(on){ ["play","pause","seek","edit","ratio","record","make","siteUrl","musicOff"].forEach(id => { const el = $("#" + id); if (el) el.disabled = on; }); }
async function recordReel(){
  if (recording) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia || !window.MediaRecorder)
    return alert("이 브라우저는 화면 녹화를 지원하지 않는다. 크롬이나 엣지 최신 버전에서 연다.");
  const type = REC_TYPES.find(t => MediaRecorder.isTypeSupported(t));
  let disp;
  try {
    disp = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true,
      preferCurrentTab: true, selfBrowserSurface: "include", surfaceSwitching: "exclude", systemAudio: "exclude" });
  } catch(e){ return; }   // 사용자가 취소
  const vtrack = disp.getVideoTracks()[0];
  if ((vtrack.getSettings().displaySurface || "browser") !== "browser"){
    disp.getTracks().forEach(t => t.stop());
    return alert("‘이 탭’을 골라 공유해야 무대만 잘라 저장할 수 있다. 다시 눌러 현재 탭을 고른다.");
  }
  recording = true; lockUI(true); document.body.classList.add("rec");
  const oldTitle = document.title;

  // 탭 화면 → 캔버스(무대만 잘라 표준 크기로) → 녹화
  const portrait = $("#stage").classList.contains("portrait");
  const W = portrait ? 1080 : 1920, H = portrait ? 1920 : 1080;
  const video = document.createElement("video"); video.muted = true; video.playsInline = true; video.srcObject = disp; await video.play();
  const canvas = document.createElement("canvas"); canvas.width = W; canvas.height = H;
  const g = canvas.getContext("2d");
  let drawing = true;
  (function draw(){ if (!drawing) return;
    const r = $("#stage").getBoundingClientRect(), sx = video.videoWidth / innerWidth, sy = video.videoHeight / innerHeight;
    if (video.videoWidth) g.drawImage(video, r.left * sx, r.top * sy, r.width * sx, r.height * sy, 0, 0, W, H);
    requestAnimationFrame(draw); })();
  const out = canvas.captureStream(30);
  let atrack = disp.getAudioTracks()[0];
  if (!atrack && musicOn() && /^blob:/.test(bgm.src)){   // 탭 오디오를 안 켰어도, 고른 음악 파일은 직접 섞어 넣는다
    audioCtx = audioCtx || new AudioContext();
    if (!bgmNode){ bgmNode = audioCtx.createMediaElementSource(bgm); bgmNode.connect(audioCtx.destination); }
    const dest = audioCtx.createMediaStreamDestination(); bgmNode.connect(dest); atrack = dest.stream.getAudioTracks()[0];
  }
  if (atrack) out.addTrack(atrack);

  const chunks = [];
  const rec = new MediaRecorder(out, { mimeType: type, videoBitsPerSecond: 8_000_000, audioBitsPerSecond: 160_000 });
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const done = new Promise(r => rec.onstop = r);

  await new Promise(r => setTimeout(r, 400));   // 무대가 커진 화면이 녹화 화면에 반영될 시간
  rec.start(250); playFrom(0);
  const tStart = performance.now();
  const timer = setInterval(() => { const s = Math.min(DUR, (performance.now() - tStart) / 1000);
    document.title = `● 녹화 중 ${s.toFixed(0)} / 15초`; }, 250);
  await new Promise(r => setTimeout(r, DUR * 1000 + 300));
  clearInterval(timer); rec.stop(); await done;
  drawing = false; disp.getTracks().forEach(t => t.stop()); out.getTracks().forEach(t => t.stop());
  document.body.classList.remove("rec"); document.title = oldTitle; lockUI(false); recording = false;

  const ext = /mp4/.test(type) ? "mp4" : "webm";
  const blob = new Blob(chunks, { type: type.split(";")[0] });
  const name = `쇼릴_${(normalize(SPEC).name || "site").replace(/[\\/:*?"<>|\s]+/g, "_")}_${portrait ? "9x16" : "16x9"}.${ext}`;
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  setUrlMsg(`영상 저장: ${name} (${(blob.size / 1048576).toFixed(1)}MB${atrack ? ", 소리 포함" : ", 소리 없음"})` +
    (ext === "webm" ? " · 이 브라우저는 MP4 녹화를 지원하지 않아 WebM으로 저장했다" : ""), "ok");
}
$("#record").onclick = recordReel;

/* ───────── 5. 시작: 이미지 프리로드 후 재생 ───────── */
function start(){
  const S = render(SPEC);
  setMusicSource(S);
  const all = [S.logo, S.mark, S.photos.hero, S.photos.people, ...(S.photos.strip||[]), ...S.depts.map(d=>d.img)].filter(Boolean);
  Promise.all([...new Set(all)].map(src => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = src; setTimeout(r, 4000); })))
    .then(() => playFrom(0));
}
start();
</script>
